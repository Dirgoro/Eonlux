label live-amd64
	menu label ^Iniciar EonluxOS (Modo Live)
	menu default
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components hostname=eonluxos username=user user-fullname=EonluxOS locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo quiet splash plymouth.enable=1 loglevel=3 vt.global_cursor_default=0 video=1024x768-32

label live-amd64-failsafe
	menu label ^EonluxOS (Modo de Seguranca)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components hostname=eonluxos username=user memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=788
