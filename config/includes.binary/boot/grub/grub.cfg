set default=0
set timeout=5

if loadfont /boot/grub/fonts/unicode.pf2 ; then
  set gfxmode=1024x600,auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

set gfxpayload=keep
set menu_color_normal=white/black
set menu_color_highlight=white/blue

menuentry "Iniciar EonluxOS (Modo Live)" {
  linux /live/vmlinuz boot=live components hostname=eonluxos username=user user-fullname=EonluxOS locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo quiet splash plymouth.enable=1 loglevel=3 vt.global_cursor_default=0
  initrd /live/initrd.img
}

menuentry "EonluxOS (Modo de Seguranca)" {
  linux /live/vmlinuz boot=live components hostname=eonluxos username=user memtest noapic noapm nodma nomce nolapic nosmp nosplash
  initrd /live/initrd.img
}
