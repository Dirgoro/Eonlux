# EonluxOS 1.0 Core - Otimizacao de Memoria em Duas Camadas (ZRAM + Disco)

# So inicia paginacao quando a RAM estiver sob pressao real (~75-80% de uso)
vm.swappiness = 60

# Leitura pagina-a-pagina (zero read-ahead), ideal para ZRAM e SSD
vm.page-cluster = 0

# Equilibra retencao de cache de arquivos e metadados sem sufocar apps
vm.vfs_cache_pressure = 100

# Evita engasgos de I/O ao despejar cache sujo para o SSD/HD
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
