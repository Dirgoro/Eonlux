name: Build EonluxOS Live ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    name: Build Debian Trixie Live ISO (amd64)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build and hybrid bootloader dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            gdisk \
            cpio \
            zstd

      - name: Sanitize line endings (CRLF to LF), permissions and loop devices
        run: |
          # Converte CRLF para LF apenas em ficheiros de texto, ignorando .git e binarios
          find . -path './.git' -prune -o -type f \
            ! -name '*.png' ! -name '*.jpg' ! -name '*.jpeg' ! -name '*.ico' \
            ! -name '*.svgz' ! -name '*.gz' ! -name '*.xz' ! -name '*.deb' \
            -print0 | xargs -0 -r sed -i 's/\r$//'

          # Garante permissao de execucao em scripts e hooks
          find ./auto ./config -type f \( -name '*.sh' -o -name '*.hook.*' \) -print0 | xargs -0 -r chmod +x
          if [ -d ./config/includes.chroot/usr/local/bin ]; then
            find ./config/includes.chroot/usr/local/bin -type f -print0 | xargs -0 -r chmod +x
          fi
          if [ -d ./config/includes.chroot/usr/local/sbin ]; then
            find ./config/includes.chroot/usr/local/sbin -type f -print0 | xargs -0 -r chmod +x
          fi

          # Garante dispositivos loop disponiveis para o live-build no container
          for i in $(seq 0 7); do
            [ -e "/dev/loop$i" ] || mknod -m 660 "/dev/loop$i" b 7 "$i" || true
          done

      - name: Configure live-build
        run: |
          lb clean --purge || true
          lb config

      - name: Build ISO image
        run: |
          set -o pipefail
          lb build 2>&1 | tee build.log

      - name: Prepare ISO artifact and SHA256 checksum
        run: |
          mkdir -p release
          ISO_FILE=$(ls -1 *.hybrid.iso *.iso 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "Erro: Nenhuma imagem ISO foi gerada." >&2
            exit 1
          fi
          mv "$ISO_FILE" release/eonluxos-1.0-core-amd64.iso
          cd release
          sha256sum eonluxos-1.0-core-amd64.iso > eonluxos-1.0-core-amd64.iso.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: eonluxos-1.0-core-amd64
          path: |
            release/eonluxos-1.0-core-amd64.iso
            release/eonluxos-1.0-core-amd64.iso.sha256
          retention-days: 7

      - name: Upload build.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: build.log
          if-no-files-found: ignore
