# Configuração padrão de Touchpad e Ponteiros (libinput) - EonLux Legacy
Section "InputClass"
    Identifier "EonLux Touchpad Configuration"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"
    Option "ClickMethod" "clickfinger"
    Option "DisableWhileTyping" "true"
EndSection
