# Otimizações de memória e cache do kernel para o EonLux Legacy

# Prioriza o uso de páginas comprimidas em ZRAM antes de recorrer ao disco
vm.swappiness = 120

# Reduz latência de leitura/escrita em dispositivos de swap comprimido (ZRAM)
vm.page-cluster = 0

# Mantém cache de diretórios e inodes equilibrado para fluidez no gerenciador de arquivos
vm.vfs_cache_pressure = 60
